version: '3.8'

services:
  chat-server:
    build:
      context: .
      dockerfile: docker/chatServer.dockerfile
    container_name: chat-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC
    volumes:
      - chat-server-logs:/app/logs
    networks:
      - chat-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          memory: 384M

networks:
  chat-network:
    driver: bridge

volumes:
  chat-server-logs:
    driver: local 