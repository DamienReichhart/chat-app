status = warn
name = ChatClientLog4j2Config

# Properties
property.basePath = logs
property.filename = chat-client
property.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n
property.filePattern = %d{yyyy-MM-dd}-%i.log

# Root logger
rootLogger.level = INFO
rootLogger.appenderRefs = stdout, file
rootLogger.appenderRef.stdout.ref = STDOUT
rootLogger.appenderRef.file.ref = FILE

# Package-specific logging
logger.ap4.name = com.ap4.client
logger.ap4.level = DEBUG
logger.ap4.additivity = false
logger.ap4.appenderRefs = stdout, file
logger.ap4.appenderRef.stdout.ref = STDOUT
logger.ap4.appenderRef.file.ref = FILE

# WebSocket debug logging
logger.websocket.name = com.ap4.client.websocket
logger.websocket.level = DEBUG
logger.websocket.additivity = false
logger.websocket.appenderRefs = stdout, file, websocket
logger.websocket.appenderRef.stdout.ref = STDOUT
logger.websocket.appenderRef.file.ref = FILE
logger.websocket.appenderRef.websocket.ref = WEBSOCKET_FILE

# Console Appender
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${pattern}
appender.console.filter.threshold.type = ThresholdFilter
appender.console.filter.threshold.level = INFO

# File Appender
appender.file.type = RollingFile
appender.file.name = FILE
appender.file.fileName = ${basePath}/${filename}.log
appender.file.filePattern = ${basePath}/${filename}-${filePattern}
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = ${pattern}
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1
appender.file.policies.time.modulate = true
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 10

# WebSocket Debug Log
appender.websocket.type = RollingFile
appender.websocket.name = WEBSOCKET_FILE
appender.websocket.fileName = ${basePath}/websocket.log
appender.websocket.filePattern = ${basePath}/websocket-${filePattern}
appender.websocket.layout.type = PatternLayout
appender.websocket.layout.pattern = ${pattern}
appender.websocket.policies.type = Policies
appender.websocket.policies.time.type = TimeBasedTriggeringPolicy
appender.websocket.policies.time.interval = 1
appender.websocket.policies.time.modulate = true
appender.websocket.policies.size.type = SizeBasedTriggeringPolicy
appender.websocket.policies.size.size = 10MB
appender.websocket.strategy.type = DefaultRolloverStrategy
appender.websocket.strategy.max = 5 