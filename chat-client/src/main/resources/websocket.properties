# WebSocket Configuration Properties

# Server connection
websocket.url=ws://server.ap4.damien-reichhart.fr:8080/api/ws
websocket.timeout=5000
websocket.ping_interval=30000

# Reconnection settings
websocket.reconnect.auto=true
websocket.reconnect.attempts=5
websocket.reconnect.delay=2000
websocket.reconnect.max_delay=30000

# Message handling
websocket.buffer.size=1024
websocket.message.max_size=65536

# Security settings
websocket.ssl.enabled=false
websocket.auth.token_header=X-Auth-Token