# Application Configuration Properties

# Application name and version
application.name=Chat Client
application.version=1.0.0

# Locale settings
application.locale=en
application.timezone=UTC

# UI Settings
ui.theme=light
ui.animations.enabled=true
ui.window.title=AP4 Chat Client
ui.notifications.enabled=true

# Cache Settings
cache.enabled=true
cache.max_size=100
cache.expire_minutes=30

# Performance Settings
performance.threading.max_threads=10

# File upload settings
file.upload.max_size=10485760
file.upload.allowed_extensions=jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,txt

# Message Settings
message.max_length=5000
message.history.load_count=50

# User Settings
user.status.auto_away_minutes=10 