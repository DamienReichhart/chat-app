name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  MAVEN_OPTS: -Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true
  MAVEN_CLI_OPTS: --batch-mode --errors --fail-at-end --show-version
  JAVA_VERSION: '21'

jobs:
  # Validate the project's structure and dependencies
  validate:
    name: Validate Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Validate with Maven
        run: mvn ${{ env.MAVEN_CLI_OPTS }} validate

  # Compile the source code
  compile:
    name: Compile Project
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compile and install with Maven
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean compile package install -DskipTests

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: |
            */target/classes/
            */target/*.jar
          retention-days: 1

  # Run all tests
  test:
    name: Run All Tests
    runs-on: ubuntu-latest
    needs: [compile]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Download compiled artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-classes

      - name: Run all tests
        run: mvn ${{ env.MAVEN_CLI_OPTS }} test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            */target/surefire-reports/
            */target/site/jacoco/
            */target/*.jar
          retention-days: 7

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: All Module Tests
          path: "*/target/surefire-reports/TEST-*.xml"
          reporter: java-junit
        continue-on-error: true

  # Code coverage report for all modules
  code-coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results

      - name: Generate coverage report
        run: mvn ${{ env.MAVEN_CLI_OPTS }} jacoco:report jacoco:report-aggregate

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: target/site/jacoco-aggregate/
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./target/site/jacoco-aggregate/jacoco.xml
          fail_ci_if_error: false

  # Build all modules
  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven
        run: mvn ${{ env.MAVEN_CLI_OPTS }} clean package install -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            chat-common/target/*.jar
            chat-client/target/*.jar
            chat-server/target/*.jar
          retention-days: 7

  # Package client for Linux - using Docker
  package-linux:
    name: Package Linux Client
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t jpackage-linux -f docker/buildLinux.dockerfile .

      - name: Create Linux packages
        run: |
          docker run -v $(pwd):/app jpackage-linux make jpackage-linux-client

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            chat-client/build/*.deb
            chat-client/build/*.rpm
          retention-days: 30

  # Package client for Windows - using Windows Runner
  package-windows:
    name: Package Windows Client
    runs-on: windows-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Build and package Windows client
        run: |
          mvn clean package install -DskipTests
          cd chat-client
          mkdir -p build
          jpackage --name AP4 --input target --main-jar chat-client-1.0-SNAPSHOT.jar --main-class com.ap4.client.Bootstrap --type exe --dest build --java-options "-Xmx2048m" --icon src/main/resources/logo.ico --vendor "REICHHART Damien"
          jpackage --name AP4 --input target --main-jar chat-client-1.0-SNAPSHOT.jar --main-class com.ap4.client.Bootstrap --type msi --dest build --java-options "-Xmx2048m" --icon src/main/resources/logo.ico --vendor "REICHHART Damien"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            chat-client/build/*.exe
            chat-client/build/*.msi
          retention-days: 30

  # Create GitHub Release with client packages
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [package-linux, package-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: AP4 Chat Client ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## AP4 Chat Client Release ${{ github.ref_name }}
            
            ### Downloads
            - **Linux**: DEB and RPM packages available
            - **Windows**: EXE and MSI installers available
            
            ### Installation
            - **Linux DEB**: `sudo dpkg -i AP4_*.deb`
            - **Linux RPM**: `sudo rpm -i AP4_*.rpm`
            - **Windows**: Run the EXE or MSI installer
            
            ### Changes
            See the commit history for detailed changes.
          files: |
            chat-client/build/*.deb
            chat-client/build/*.rpm
            chat-client/build/*.exe
            chat-client/build/*.msi
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

