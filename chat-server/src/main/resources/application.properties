# Application name and basic settings
spring.application.name=chat-server
server.port=8080

# Server context path
server.servlet.context-path=/api

# Logging configuration
logging.level.root=INFO
logging.level.com.ap4=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.messaging=INFO
logging.level.org.springframework.web.socket=INFO

# WebSocket settings
spring.websocket.max-text-message-size=1048576
spring.websocket.max-binary-message-size=1048576
spring.websocket.max-session-idle-timeout=600000

# Actuator settings
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
